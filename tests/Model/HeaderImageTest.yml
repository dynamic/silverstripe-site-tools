SilverStripe\Security\Group:
  cmsauthors:
    Title: 'HeaderImage Authors'
  otheradmins:
    Title: 'HeaderImage Other Authors'
  admins:
    Title: 'HeaderImage Admins'

SilverStripe\Security\Permission:
  cmsmain:
    Code: CMS_ACCESS_CMSMain
    Type: 1
    Group: =>SilverStripe\Security\Group.cmsauthors
  othercmsmain:
    Code: CMS_ACCESS_CMSMain
    Type: 1
    Group: =>SilverStripe\Security\Group.otheradmins
  admincode:
    Code: ADMIN
    Type: 1
    Group: =>SilverStripe\Security\Group.admins

SilverStripe\Security\Member:
  cmsauthor:
    FirstName: CMS
    Surname: Author
    Email: cmsauthor@example.com
    Groups: =>SilverStripe\Security\Group.cmsauthors
  nobody:
    FirstName: No
    Surname: Access
    Email: nobody@example.com
  publisher:
    FirstName: Pub
    Surname: Lisher
    Email: publisher@example.com
    Groups: =>SilverStripe\Security\Group.admins
  pageeditor:
    FirstName: Page
    Surname: Editor
    Email: pageeditor@example.com
    Groups: =>SilverStripe\Security\Group.otheradmins

Dynamic\SiteTools\Model\HeaderImage:
  deep:
    Title: 'Owned by a page below the classes the owner walk skips'
  middle:
    Title: 'Owned by a page that inherits the header image column'
  restrictedredirector:
    Title: 'Owned by a restricted redirector'
  openredirector:
    Title: 'Owned by an open redirector'
  restrictederror:
    Title: 'Owned by a restricted error page'
  openerror:
    Title: 'Owned by an open error page'
  shared:
    Title: 'Owned by both an open and a restricted page'
  liveonly:
    Title: 'Owned by a page that only points at it on Live'

Dynamic\SiteTools\Test\TestOnly\Page\MiddleTestPage:
  middle:
    Title: 'Page that inherits the header image column'
    CanEditType: LoggedInUsers
    HeaderImage: =>Dynamic\SiteTools\Model\HeaderImage.middle
  liveonly:
    Title: 'Page that owns a header image on Live only'
    CanEditType: OnlyTheseUsers
    EditorGroups: =>SilverStripe\Security\Group.otheradmins
    HeaderImage: =>Dynamic\SiteTools\Model\HeaderImage.liveonly

Dynamic\SiteTools\Test\TestOnly\Page\DeepTestPage:
  deep:
    Title: 'Page below the classes the owner walk skips'
    CanEditType: OnlyTheseUsers
    EditorGroups: =>SilverStripe\Security\Group.otheradmins
    HeaderImage: =>Dynamic\SiteTools\Model\HeaderImage.deep

SilverStripe\CMS\Model\RedirectorPage:
  restricted:
    Title: 'Restricted redirector'
    RedirectionType: External
    ExternalURL: 'https://example.com'
    CanEditType: OnlyTheseUsers
    EditorGroups: =>SilverStripe\Security\Group.otheradmins
    HeaderImage: =>Dynamic\SiteTools\Model\HeaderImage.restrictedredirector
  open:
    Title: 'Open redirector'
    RedirectionType: External
    ExternalURL: 'https://example.com'
    CanEditType: LoggedInUsers
    HeaderImage: =>Dynamic\SiteTools\Model\HeaderImage.openredirector
  sharedopen:
    Title: 'Open page sharing a header image'
    RedirectionType: External
    ExternalURL: 'https://example.com'
    CanEditType: LoggedInUsers
    HeaderImage: =>Dynamic\SiteTools\Model\HeaderImage.shared

SilverStripe\ErrorPage\ErrorPage:
  restricted:
    Title: 'Restricted error page'
    ErrorCode: 404
    CanEditType: OnlyTheseUsers
    EditorGroups: =>SilverStripe\Security\Group.otheradmins
    HeaderImage: =>Dynamic\SiteTools\Model\HeaderImage.restrictederror
  open:
    Title: 'Open error page'
    ErrorCode: 500
    CanEditType: LoggedInUsers
    HeaderImage: =>Dynamic\SiteTools\Model\HeaderImage.openerror
  sharedrestricted:
    Title: 'Restricted page sharing a header image'
    ErrorCode: 403
    CanEditType: OnlyTheseUsers
    EditorGroups: =>SilverStripe\Security\Group.otheradmins
    HeaderImage: =>Dynamic\SiteTools\Model\HeaderImage.shared
